[package]
name = "bay"
version = "0.10.1"
edition = "2021"

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive", "env"] }
futures = "0.3.32"
http = "1.4.1"
hyper = { version = "1.9.0", features = ["http1", "server"] }
jsonwebtoken = "10.4.0"
proto = { path = "../proto" }
rand = "0.10.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal", "sync"] }
uuid = { version = "1.23.2", features = ["v4"] }
