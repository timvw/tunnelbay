[package]
name = "bay"
version = "0.10.1"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.0"
clap = { version = "4.6.5", features = ["derive", "env"] }
futures = "0.3.33"
http = "1.4.2"
hyper = { version = "1.11.0", features = ["http1", "server"] }
jsonwebtoken = "10.4.0"
proto = { path = "../proto" }
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
uuid = { version = "1.24.0", features = ["v4"] }
