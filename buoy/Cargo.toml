[package]
name = "buoy"
version = "0.10.1"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
futures = "0.3.33"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
proto = { path = "../proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "net", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }

[dev-dependencies]
hyper014 = { package = "hyper", version = "0.14.32", features = ["full"] }
tempfile = "3.27.0"
